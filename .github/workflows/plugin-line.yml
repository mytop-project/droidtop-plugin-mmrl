name: Plugin line

# plugin/stable is exactly upstream-sync's pinned commit with plugin-core written over it (README "Branches"). This
# rebuilds that composition on every push to plugin-core or a line, and fails on any difference: a recipe change
# made on a line instead of on plugin-core. The tool lives once, in mytop-project/droidtop-platforms, pinned by commit.
on:
  push:
    branches: [plugin-core, 'plugin/**']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  line:
    uses: mytop-project/droidtop-platforms/.github/workflows/plugin-line-check.yml@361b1c53c1bb7b05952f7dbc8fdea041675a793f
    with:
      tool-ref: a4c505977c3661297b42806dac8c6306e61a53bf
